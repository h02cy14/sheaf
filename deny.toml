# cargo-deny configuration: licence, ban and source rules for Rust crates.
# CI runs `cargo deny check licenses bans sources` (blocking) and
# `cargo deny check advisories` (informational). See docs/licences.md.

[graph]
# Resolve dependencies for the platforms we actually ship, not every target.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]

[licenses]
# Permissive licences only. Anything else must be discussed with the owner,
# recorded in docs/licences.md, and added below as a per-crate exception.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

# MPL-2.0 is weak, file-level copyleft: using the crates unmodified places no
# obligations on our code. Allowed only for these named crates, all pulled in
# by Tauri. Any new MPL crate fails CI until reviewed (docs/licences.md).
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Brief §2: no ads, no third-party analytics or crash reporting.
deny = [
  { crate = "sentry" },
  { crate = "sentry-core" },
  { crate = "tauri-plugin-sentry" },
  { crate = "sentry-tauri" },
  { crate = "posthog-rs" },
  { crate = "tauri-plugin-aptabase" },
  { crate = "aptabase" },
  { crate = "segment" },
  { crate = "mixpanel-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
